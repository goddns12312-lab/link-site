<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>링크잇 배너 관리</title>
<style>
:root{--bg:#0a0a14;--card:#12121e;--border:#2a2a3e;--text:#e5e7eb;--muted:#9ca3af;--accent:#a78bfa;--danger:#ef4444;--success:#22c55e;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;gap:16px}
header h1{font-size:20px;font-weight:900}
header h1 span{color:var(--accent)}
header a{font-size:13px;color:var(--muted)}
.wrap{max-width:900px;margin:0 auto;padding:20px}
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
.section h2{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section h2 .badge{background:var(--accent);color:#000;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:40px 20px;text-align:center;cursor:pointer;transition:border-color .2s}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);background:rgba(167,139,250,.05)}
.drop-zone p{color:var(--muted);font-size:14px}
.drop-zone .hint{font-size:12px;color:var(--muted);margin-top:6px;opacity:.7}
#file-input{display:none}
.preview-box{margin-top:12px;display:none}
.preview-box img{max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--border)}
.preview-box .meta{font-size:12px;color:var(--muted);margin-top:4px}
.form-row{display:flex;gap:10px;margin-top:12px}
.form-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;outline:none}
.form-row input:focus{border-color:var(--accent)}
.form-row input::placeholder{color:var(--muted);opacity:.6}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#000}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.add-row{display:flex;justify-content:flex-end;margin-top:14px}
.banner-card{display:flex;gap:14px;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;align-items:center;transition:border-color .2s}
.banner-card:hover{border-color:var(--accent)}
.banner-card .thumb{width:180px;height:auto;max-height:100px;object-fit:contain;border-radius:6px;flex-shrink:0;background:#000}
.banner-card .info{flex:1;min-width:0}
.banner-card .info .lbl{font-size:14px;font-weight:700;margin-bottom:2px}
.banner-card .info .url{font-size:12px;color:var(--accent);word-break:break-all}
.banner-card .info .alt{font-size:11px;color:var(--muted);margin-top:2px}
.banner-card .info .dims{font-size:11px;color:var(--muted);opacity:.7}
.banner-card .actions{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.order-num{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#000;font-size:11px;font-weight:900;border-radius:50%;flex-shrink:0}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--success);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.edit-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:480px}
.edit-box h3{font-size:15px;font-weight:800;margin-bottom:14px}
.edit-box .form-row{flex-direction:column;gap:8px}
.edit-box .form-row label{font-size:12px;color:var(--muted);font-weight:600}
.edit-box .form-row input{width:100%}
.edit-box .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:640px){
  .banner-card{flex-direction:column;align-items:stretch}
  .banner-card .thumb{width:100%;max-height:140px}
  .banner-card .actions{flex-direction:row;justify-content:flex-end}
  .form-row{flex-direction:column}
}
</style>
</head>
<body>
<header>
  <h1>링크잇 <span>배너 관리</span></h1>
  <a href="/">← 메인으로</a>
</header>

<div class="wrap">
  <!-- 배너 추가 -->
  <div class="section">
    <h2>배너 추가</h2>
    <div class="drop-zone" id="dropZone">
      <p>이미지를 드래그하거나 클릭해서 업로드</p>
      <p class="hint">PNG, JPG, GIF, WebP (권장: 728×90 이상)</p>
      <input type="file" id="file-input" accept="image/*">
    </div>
    <div class="preview-box" id="previewBox">
      <img id="previewImg" src="" alt="미리보기">
      <div class="meta" id="previewMeta"></div>
    </div>
    <div class="form-row">
      <input type="text" id="inUrl" placeholder="클릭 시 이동할 URL (예: https://example.com)">
    </div>
    <div class="form-row">
      <input type="text" id="inAlt" placeholder="이미지 설명 — SEO에 중요 (예: ○○카지노 공식 배너)">
      <input type="text" id="inLabel" placeholder="배너 이름 (관리용)">
    </div>
    <div class="add-row">
      <button class="btn btn-primary" id="addBtn" disabled>추가</button>
    </div>
  </div>

  <!-- 등록된 배너 -->
  <div class="section">
    <h2>등록된 배너 <span class="badge" id="countBadge">0</span></h2>
    <div id="bannerList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = {
  list: () => fetch('/api/banners/list').then(r=>r.json()),
  add: d => fetch('/api/banners/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json()),
  del: id => fetch('/api/banners/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}).then(r=>r.json()),
  reorder: ids => fetch('/api/banners/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})}).then(r=>r.json()),
  update: d => fetch('/api/banners/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json()),
};

function fixUrl(u) {
  if (!u || u === '#') return '#';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

let banners = [];
let fileData = null; // { base64, ext, width, height }

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('file-input');
const previewBox = document.getElementById('previewBox');
const previewImg = document.getElementById('previewImg');
const previewMeta = document.getElementById('previewMeta');
const addBtn = document.getElementById('addBtn');
const bannerList = document.getElementById('bannerList');
const countBadge = document.getElementById('countBadge');
const toastEl = document.getElementById('toast');

// --- 드래그 앤 드롭 ---
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('over'); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = () => {
    const b64 = reader.result.split(',')[1];
    const ext = file.name.split('.').pop().toLowerCase().replace('jpeg','jpg');
    const img = new Image();
    img.onload = () => {
      fileData = { base64: b64, ext, width: img.naturalWidth, height: img.naturalHeight };
      previewImg.src = reader.result;
      previewMeta.textContent = img.naturalWidth + ' × ' + img.naturalHeight + 'px · ' + (file.size/1024).toFixed(1) + 'KB · ' + ext.toUpperCase();
      previewBox.style.display = 'block';
      addBtn.disabled = false;
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

// --- 배너 추가 ---
addBtn.addEventListener('click', async () => {
  if (!fileData) return;
  addBtn.disabled = true;
  addBtn.textContent = '업로드 중…';
  try {
    await API.add({
      image: fileData.base64,
      ext: fileData.ext,
      url: fixUrl(document.getElementById('inUrl').value.trim()),
      alt: document.getElementById('inAlt').value.trim(),
      label: document.getElementById('inLabel').value.trim(),
      width: fileData.width,
      height: fileData.height,
    });
    fileData = null;
    previewBox.style.display = 'none';
    document.getElementById('inUrl').value = '';
    document.getElementById('inAlt').value = '';
    document.getElementById('inLabel').value = '';
    fileInput.value = '';
    toast('배너가 추가되었습니다');
    await loadBanners();
  } catch(e) {
    toast('오류: ' + e.message);
  }
  addBtn.textContent = '추가';
  addBtn.disabled = !fileData;
});

// --- 배너 목록 ---
async function loadBanners() {
  banners = await API.list();
  countBadge.textContent = banners.length;
  render();
}

function render() {
  if (!banners.length) {
    bannerList.innerHTML = '<div class="empty">등록된 배너가 없습니다</div>';
    return;
  }
  bannerList.innerHTML = '';
  banners.forEach((b, i) => {
    const card = document.createElement('div');
    card.className = 'banner-card';
    card.innerHTML =
      '<span class="order-num">' + (i+1) + '</span>' +
      '<img class="thumb" src="' + b.image + '?t=' + Date.now() + '" alt="' + esc(b.alt) + '">' +
      '<div class="info">' +
        '<div class="lbl">' + esc(b.label || '이름 없음') + '</div>' +
        '<div class="url">' + esc(b.url) + '</div>' +
        '<div class="alt">alt: ' + esc(b.alt || '없음') + '</div>' +
        (b.width ? '<div class="dims">' + b.width + '×' + b.height + 'px</div>' : '') +
      '</div>' +
      '<div class="actions"></div>';
    const acts = card.querySelector('.actions');
    if (i > 0) acts.appendChild(mkBtn('↑', 'btn btn-sm btn-primary', () => move(i, i-1)));
    if (i < banners.length-1) acts.appendChild(mkBtn('↓', 'btn btn-sm btn-primary', () => move(i, i+1)));
    acts.appendChild(mkBtn('편집', 'btn btn-sm', () => editBanner(b)));
    acts.appendChild(mkBtn('삭제', 'btn btn-sm btn-danger', () => deleteBanner(b.id)));
    bannerList.appendChild(card);
  });
}

function mkBtn(text, cls, fn) {
  const b = document.createElement('button');
  b.className = cls;
  b.textContent = text;
  b.onclick = fn;
  return b;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// --- 순서 변경 ---
async function move(from, to) {
  const item = banners.splice(from, 1)[0];
  banners.splice(to, 0, item);
  render();
  await API.reorder(banners.map(b => b.id));
  toast('순서가 변경되었습니다');
}

// --- 삭제 ---
async function deleteBanner(id) {
  if (!confirm('이 배너를 삭제하시겠습니까?')) return;
  await API.del(id);
  toast('배너가 삭제되었습니다');
  await loadBanners();
}

// --- 편집 ---
function editBanner(b) {
  const overlay = document.createElement('div');
  overlay.className = 'edit-overlay';
  overlay.innerHTML =
    '<div class="edit-box">' +
      '<h3>배너 편집</h3>' +
      '<div class="form-row">' +
        '<label>URL</label><input id="ed-url" value="' + esc(b.url) + '">' +
      '</div>' +
      '<div class="form-row">' +
        '<label>이미지 설명 (SEO)</label><input id="ed-alt" value="' + esc(b.alt) + '">' +
      '</div>' +
      '<div class="form-row">' +
        '<label>배너 이름</label><input id="ed-label" value="' + esc(b.label) + '">' +
      '</div>' +
      '<div class="btns"></div>' +
    '</div>';
  const btns = overlay.querySelector('.btns');
  btns.appendChild(mkBtn('취소', 'btn btn-sm', () => overlay.remove()));
  btns.appendChild(mkBtn('저장', 'btn btn-sm btn-primary', async () => {
    await API.update({
      id: b.id,
      url: fixUrl(overlay.querySelector('#ed-url').value.trim()),
      alt: overlay.querySelector('#ed-alt').value.trim(),
      label: overlay.querySelector('#ed-label').value.trim(),
    });
    overlay.remove();
    toast('수정되었습니다');
    await loadBanners();
  }));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

// --- 토스트 ---
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2000);
}

// 초기 로드
loadBanners();
</script>
</body>
</html>
